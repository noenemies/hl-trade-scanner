name: trade-scanner
on:
  schedule:
    - cron: '*/30 * * * *'   # во время цепочки встают в очередь и подхватывают эстафету
  workflow_dispatch:
concurrency:
  group: scanner
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  chain:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      TZ: America/Chicago
      CI: "true"
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: scan loop (10 итераций по ~29 минут)
        run: |
          git config user.name "scanner-bot"
          git config user.email "scanner@local"
          for i in $(seq 1 10); do
            echo "--- итерация $i: $(date) ---"
            # Синхронизация состояния. Раньше здесь был `git pull --rebase || true`:
            # при конфликте по scanner_state.json репозиторий оставался в недоделанном
            # ребейзе, прогон шёл на СТАРОМ состоянии, позиция "открывалась" заново и
            # сделка писалась в журнал повторно (отсюда дубли и неверные R в отчёте).
            git rebase --abort 2>/dev/null || true
            git fetch -q origin main && git reset -q --hard origin/main
            python3 trade_scanner.py --auto --quiet || true
            git add -A -- '*.json' signals.log 2>/dev/null || true
            if git commit -qm "state $(date -u +%F_%H%M)"; then
              pushed=""
              for try in 1 2 3; do
                if git push -q origin main; then pushed=ok; break; fi
                # Нас опередили. Состояние только что отработавшего прогона свежее,
                # поэтому переносим коммит поверх удалённого, не теряя свои файлы.
                git fetch -q origin main
                git reset -q --soft origin/main
                git add -A -- '*.json' signals.log 2>/dev/null || true
                git commit -qm "state $(date -u +%F_%H%M) retry$try" || true
              done
              [ -z "$pushed" ] && echo "ВНИМАНИЕ: состояние НЕ запушено на итерации $i"
            fi
            [ "$i" -lt 10 ] && sleep 1680
          done
